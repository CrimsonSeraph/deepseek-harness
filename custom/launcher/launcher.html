<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>正在启动 DeepSeek Harness…</title>

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%,
          #1b2230 0%,
          #0f1115 55%);
      color: #e8ecf1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 48px 56px;
      max-width: 520px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 26px;
      border-radius: 50%;
      border: 4px solid #2a3446;
      border-top-color: #4f8cff;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      line-height: 1.8;
      color: #9aa7b8;
      margin: 0 0 6px;
    }

    code {
      background: #1a2130;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: #c9d4e3;
    }

    #status {
      font-size: 13px;
      color: #6f7d91;
      margin-top: 14px;
      min-height: 1.2em;
    }

    #ready {
      display: none;
      margin-top: 18px;
    }

    #hint {
      display: none;
      margin-top: 14px;
      font-size: 12px;
      color: #c9a25a;
    }

    a {
      color: #4f8cff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>

    <h1>正在启动 DeepSeek Harness</h1>

    <p>
      后端服务正在独立的控制台窗口（标题：<code>DeepSeek Harness backend</code>）中启动。<br />
      首次启动需要安装依赖并构建，可能耗时数分钟。
    </p>

    <p id="status">正在检测服务端口…</p>

    <p id="ready">
      服务已就绪。<strong>应用已由 dsh web 在默认浏览器中自动打开。</strong><br />
      如果浏览器没有自动打开，请在后台控制台窗口中找到 <code>dsh web:</code>
      开头的地址（含 <code>?token=</code>）并复制到浏览器中打开。
    </p>

    <p id="hint">长时间未就绪？请查看后端控制台窗口中的日志。</p>
  </div>

  <script>
    (function () {
      "use strict";
      var port = new URLSearchParams(window.location.search).get("port") || "3080";
      var URL = "http://127.0.0.1:" + port;
      var statusEl = document.getElementById("status");
      var readyEl = document.getElementById("ready");
      var hintEl = document.getElementById("hint");
      var start = Date.now();
      var n = 0;
      var announced = false;

      function fmt(ms) {
        var s = Math.floor(ms / 1000);
        var m = Math.floor(s / 60);
        return m + ":" + ("0" + (s % 60)).slice(-2);
      }

      function render() {
        statusEl.textContent =
          n === 1
            ? "正在检测服务端口…"
            : "已等待 " + fmt(Date.now() - start) + "（第 " + n + " 次检测）";
        if (n > 120 && !announced) {
          hintEl.style.display = "block";
          announced = true;
        }
      }

      function done() {
        // 服务已就绪：dsh web 负责用带 token 的地址打开应用。
        // 本页不再跳转到不携带 token 的裸地址（那会返回 authentication required）。
        document.getElementById("spinner").style.display = "none";
        statusEl.style.display = "none";
        readyEl.style.display = "block";
      }

      function check() {
        n++;
        render();
        if (n > 300) return;
        fetch(URL, { mode: "no-cors", cache: "no-store" })
          .then(function () {
            // 端口已响应，稍等片刻让 dsh web 完成浏览器交接。
            setTimeout(done, 2500);
          })
          .catch(function () {
            setTimeout(check, 1500);
          });
      }

      check();
    })();
  </script>
</body>

</html>
